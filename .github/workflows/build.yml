name: Build CloudStream Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Gradle Files (Auto-Fix)
        run: |
          # جلب ملفات Gradle الجاهزة
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/recloudstream/cloudstream/master/gradlew -o gradlew
          curl -sL https://raw.githubusercontent.com/recloudstream/cloudstream/master/gradlew.bat -o gradlew.bat
          curl -sL https://raw.githubusercontent.com/recloudstream/cloudstream/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/recloudstream/cloudstream/master/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

          # إصلاح ملف الإضافة الداخلي ليتوافق مع أندرويد
          cat > ArabicProvider/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.re3arabi.provider"
              compileSdk = 34

              defaultConfig {
                  minSdk = 21
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              compileOnly("com.github.recloudstream:cloudstream:master-SNAPSHOT")
              implementation("org.jsoup:jsoup:1.16.1")
              implementation("com.squareup.okhttp3:okhttp:4.11.0")
              implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2")
          }
          EOF

          # إصلاح ملف البناء الرئيسي
          cat > build.gradle.kts << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.1.4")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10")
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          EOF

      - name: Build APK
        run: ./gradlew :ArabicProvider:assembleRelease

      - name: Find and Prepare APK
        run: |
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/ \;

      - name: Generate plugins.json
        run: |
          echo '{
              "name": "Re-3arabi CloudStream Repo",
              "description": "مستودع إضافات عربية",
              "manifestVersion": 1,
              "plugins": [
                  {
                      "url": "ArabicProvider-release.apk",
                      "version": 1,
                      "description": "Arabic Provider",
                      "name": "عربي",
                      "internalName": "ArabicProvider",
                      "authors": ["Marouane"],
                      "repositoryUrl": "https://github.com/marouane1990star/re-3arabi",
                      "language": "ar"
                  }
              ]
          }' > artifacts/plugins.json

      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts
          publish_branch: build
